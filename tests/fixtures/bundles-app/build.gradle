// Root build file using the legacy buildscript classpath for AGP.
buildscript {
    ext.agp_version = '8.3.2'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"
    }
}
